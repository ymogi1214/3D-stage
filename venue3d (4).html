<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>会場3Dウォークスルー（プロトタイプ）</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; }
  canvas { display: block; }
  #info {
    position: absolute; top: 0; left: 0; width: 100%;
    text-align: center; color: #fff; font-family: sans-serif;
    padding: 16px; background: rgba(0,0,0,0.4); box-sizing: border-box;
    pointer-events: none;
  }
  #info.hidden { display: none; }

  #toolbar {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: rgba(20,20,20,0.85);
    font-family: sans-serif; box-sizing: border-box;
  }
  #toolbar button {
    font-size: 13px; padding: 6px 14px; margin-right: 8px;
    border: 1px solid #666; border-radius: 6px; background: #333; color: #fff;
    cursor: pointer;
  }
  #toolbar button.active { background: #3b6ea5; border-color: #3b6ea5; }

  #catalog {
    position: fixed; top: 52px; left: 0; bottom: 0; width: 170px; z-index: 10;
    background: rgba(20,20,20,0.9); font-family: sans-serif;
    padding: 12px; box-sizing: border-box; display: none;
  }
  #catalog.visible { display: block; }
  #catalog h3 { color: #aaa; font-size: 12px; font-weight: normal; margin: 0 0 10px; }
  .catalog-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px; margin-bottom: 6px; background: #2a2a2a; color: #eee;
    border-radius: 6px; font-size: 13px; cursor: grab;
  }

  #item-info {
    position: fixed; top: 52px; right: 0; z-index: 10;
    background: rgba(20,20,20,0.9); color: #eee; font-family: sans-serif;
    padding: 10px 16px; font-size: 13px; display: none;
  }
  #item-info.visible { display: block; }
</style>
</head>
<body>

<div id="toolbar">
  <div>
    <button id="mode-edit">編集モード</button>
    <button id="mode-walk" class="active">歩行モード</button>
  </div>
  <span id="save-status" style="color:#aaa; font-size:12px;"></span>
</div>

<div id="item-info"></div>

<div id="catalog">
  <h3>機材カタログ（ドラッグして配置）</h3>
  <div class="catalog-item" draggable="true" data-type="pc">PC</div>
  <div class="catalog-item" draggable="true" data-type="desk">机</div>
  <div class="catalog-item" draggable="true" data-type="camera">カメラ</div>
  <div class="catalog-item" draggable="true" data-type="powertap">電源タップ</div>
  <p style="color:#888; font-size:11px; margin-top:14px; line-height:1.5;">配置済みの機材をクリックで選択し、Deleteキーで削除できます</p>
</div>

<div id="info">クリックして開始 / WASDで移動 / マウスで視点操作 / ESCで解除</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

// ---- 会場データ（フェーズ1：仮の値。あとで実測値に差し替える） ----
const venue = {
  width: 20,   // X（横）
  depth: 15,   // Z（奥行き）
  height: 5.5, // 天井高
};

const pillars = [
  { x: 14, z: 2, size: 0.6, height: venue.height },
];

// ---- 基本セットアップ ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202030);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
const eyeHeight = 1.6;
camera.position.set(2, eyeHeight, venue.depth - 2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- ライト ----
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// ---- 床 ----
const floorGeo = new THREE.PlaneGeometry(venue.width, venue.depth);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(venue.width / 2, 0, venue.depth / 2);
scene.add(floor);

// 目印になるグリッド
const grid = new THREE.GridHelper(Math.max(venue.width, venue.depth), 20, 0x888888, 0x444444);
grid.position.set(venue.width / 2, 0.03, venue.depth / 2);
scene.add(grid);

// ---- 壁・天井（床とは別の面として作り、重なりをなくす） ----
const wallMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, side: THREE.FrontSide });

function makeWall(w, h, x, y, z, rotY) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  wall.position.set(x, y, z);
  wall.rotation.y = rotY;
  scene.add(wall);
}

// 北の壁（z=0側、+z方向を向く＝室内側を向く）
makeWall(venue.width, venue.height, venue.width / 2, venue.height / 2, 0, 0);
// 南の壁（z=depth側、-z方向を向くよう180度回転）
makeWall(venue.width, venue.height, venue.width / 2, venue.height / 2, venue.depth, Math.PI);
// 西の壁（x=0側、+x方向を向くよう90度回転）
makeWall(venue.depth, venue.height, 0, venue.height / 2, venue.depth / 2, Math.PI / 2);
// 東の壁（x=width側、-x方向を向くよう-90度回転）
makeWall(venue.depth, venue.height, venue.width, venue.height / 2, venue.depth / 2, -Math.PI / 2);

// 天井（下向き＝室内側を向く）
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(venue.width, venue.depth), wallMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(venue.width / 2, venue.height, venue.depth / 2);
scene.add(ceiling);

// ---- 柱 ----
const pillarMeshes = [];
const pillarMat = new THREE.MeshStandardMaterial({ color: 0xd85a30 });
pillars.forEach(p => {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(p.size, p.height, p.size),
    pillarMat
  );
  mesh.position.set(p.x, p.height / 2, p.z);
  scene.add(mesh);
  pillarMeshes.push(p);
});

// ---- 機材カタログの定義（種類ごとの見た目） ----
const equipmentSpecs = {
  pc:       { size: [0.45, 0.35, 0.3], color: 0x378add, label: 'PC' },
  desk:     { size: [1.2, 0.75, 0.6],  color: 0x8a6a4a, label: '机' },
  camera:   { size: [0.25, 0.25, 0.4], color: 0xd85a30, label: 'カメラ' },
  powertap: { size: [0.3, 0.08, 0.12], color: 0xefa927, label: '電源タップ' },
};

const placedItems = []; // { type, mesh }
let selectedItem = null;

// 机は天板+4本脚の組み合わせで作り、下にPCを置けるスペースを空ける
function createDeskMesh(spec) {
  const [w, h, d] = spec.size;
  const topThickness = 0.05;
  const legSize = 0.05;
  const mat = new THREE.MeshStandardMaterial({ color: spec.color });
  const group = new THREE.Group();

  const top = new THREE.Mesh(new THREE.BoxGeometry(w, topThickness, d), mat);
  top.position.y = h - topThickness / 2;
  group.add(top);

  const legHeight = h - topThickness;
  const offsets = [
    [ w / 2 - legSize / 2,  d / 2 - legSize / 2],
    [-(w / 2 - legSize / 2),  d / 2 - legSize / 2],
    [ w / 2 - legSize / 2, -(d / 2 - legSize / 2)],
    [-(w / 2 - legSize / 2), -(d / 2 - legSize / 2)],
  ];
  offsets.forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(legSize, legHeight, legSize), mat);
    leg.position.set(lx, legHeight / 2, lz);
    group.add(leg);
  });
  return group;
}

function placeEquipment(type, x, z) {
  const spec = equipmentSpecs[type];
  if (!spec) return;
  let obj;
  if (type === 'desk') {
    obj = createDeskMesh(spec);
    obj.position.set(x, 0, z); // 床に脚が接地する高さ
  } else {
    const [w, h, d] = spec.size;
    obj = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: spec.color })
    );
    obj.position.set(x, h / 2, z);
  }
  scene.add(obj);
  const item = { type, mesh: obj };
  placedItems.push(item);
  return item;
}

// 選択中の機材にはうっすら光る枠を付ける（Groupにも対応）
function setEmissive(mesh, hex) {
  const targets = mesh.isGroup ? mesh.children : [mesh];
  targets.forEach(m => m.material.emissive && m.material.emissive.setHex(hex));
}

const itemInfoPanel = document.getElementById('item-info');

function selectItem(item) {
  if (selectedItem) setEmissive(selectedItem.mesh, 0x000000);
  selectedItem = item;
  if (selectedItem) {
    setEmissive(selectedItem.mesh, 0x444444);
    itemInfoPanel.textContent = equipmentSpecs[selectedItem.type].label;
    itemInfoPanel.classList.add('visible');
  } else {
    itemInfoPanel.classList.remove('visible');
  }
}

function deleteSelected() {
  if (!selectedItem) return;
  scene.remove(selectedItem.mesh);
  const idx = placedItems.indexOf(selectedItem);
  if (idx !== -1) placedItems.splice(idx, 1);
  selectedItem = null;
  itemInfoPanel.classList.remove('visible');
  saveLayout();
}

// ---- 自動保存・復元（ブラウザのlocalStorageを使用） ----
const STORAGE_KEY = 'venue3d_layout_v1';
const saveStatus = document.getElementById('save-status');

function saveLayout() {
  const data = placedItems.map(i => ({
    type: i.type, x: i.mesh.position.x, z: i.mesh.position.z
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  saveStatus.textContent = '保存済み ' + new Date().toLocaleTimeString();
}

function loadLayout() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    data.forEach(d => placeEquipment(d.type, d.x, d.z));
    saveStatus.textContent = '前回の配置を復元しました';
  } catch (e) {
    console.error('保存データの読み込みに失敗しました', e);
  }
}
loadLayout();

// ---- ドラッグ＆ドロップで配置 ----
const raycaster = new THREE.Raycaster();
document.querySelectorAll('.catalog-item').forEach(el => {
  el.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', el.dataset.type);
  });
});

renderer.domElement.addEventListener('dragover', (e) => e.preventDefault());

renderer.domElement.addEventListener('drop', (e) => {
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if (!type) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(floor)[0];
  if (hit) {
    placeEquipment(type, hit.point.x, hit.point.z);
    saveLayout();
  }
});

// ---- 配置済み機材の選択・移動 ----
function getNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
}

let draggingItem = null;

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode !== 'edit') return;
  raycaster.setFromCamera(getNDC(e), camera);
  const hit = raycaster.intersectObjects(placedItems.map(i => i.mesh), true)[0];
  if (hit) {
    const item = placedItems.find(i => i.mesh === hit.object || i.mesh === hit.object.parent);
    selectItem(item);
    draggingItem = item;
  } else {
    selectItem(null);
  }
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (mode !== 'edit' || !draggingItem) return;
  raycaster.setFromCamera(getNDC(e), camera);
  const hit = raycaster.intersectObject(floor)[0];
  if (hit) {
    draggingItem.mesh.position.x = hit.point.x;
    draggingItem.mesh.position.z = hit.point.z;
  }
});

window.addEventListener('pointerup', () => {
  if (draggingItem) saveLayout();
  draggingItem = null;
});

document.addEventListener('keydown', (e) => {
  if (mode === 'edit' && (e.key === 'Delete' || e.key === 'Backspace')) {
    deleteSelected();
  }
});

// ---- モード切り替え（編集モード / 歩行モード） ----
let mode = 'walk';
const catalogPanel = document.getElementById('catalog');
const editBtn = document.getElementById('mode-edit');
const walkBtn = document.getElementById('mode-walk');

function setMode(next) {
  mode = next;
  editBtn.classList.toggle('active', mode === 'edit');
  walkBtn.classList.toggle('active', mode === 'walk');
  catalogPanel.classList.toggle('visible', mode === 'edit');
  if (mode === 'edit' && document.pointerLockElement === renderer.domElement) {
    document.exitPointerLock();
  }
}
editBtn.addEventListener('click', () => setMode('edit'));
walkBtn.addEventListener('click', () => setMode('walk'));

// ---- 視点操作（ポインターロック） ----
let yaw = Math.PI;   // 左右
let pitch = 0;       // 上下
const info = document.getElementById('info');

renderer.domElement.addEventListener('click', () => {
  if (mode !== 'walk') return;
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  info.classList.toggle('hidden', document.pointerLockElement === renderer.domElement);
});

document.addEventListener('mousemove', (e) => {
  if (mode !== 'walk') return;
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0025;
  pitch -= e.movementY * 0.0025;
  pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
});

// ---- 移動操作 ----
const keys = {};
document.addEventListener('keydown', (e) => { if (mode === 'walk') keys[e.code] = true; });
document.addEventListener('keyup', (e) => keys[e.code] = false);

const moveSpeed = 3.5; // m/s
const margin = 0.4;    // 壁との最小距離

function collides(x, z) {
  // 会場の外枠との衝突
  if (x < margin || x > venue.width - margin) return true;
  if (z < margin || z > venue.depth - margin) return true;
  // 柱との衝突（簡易な矩形判定）
  for (const p of pillarMeshes) {
    const half = p.size / 2 + margin;
    if (Math.abs(x - p.x) < half && Math.abs(z - p.z) < half) return true;
  }
  return false;
}

let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.sin(yaw + Math.PI / 2), 0, Math.cos(yaw + Math.PI / 2));

  let dx = 0, dz = 0;
  if (keys['KeyW']) { dx -= forward.x; dz -= forward.z; }
  if (keys['KeyS']) { dx += forward.x; dz += forward.z; }
  if (keys['KeyA']) { dx -= right.x; dz -= right.z; }
  if (keys['KeyD']) { dx += right.x; dz += right.z; }

  const len = Math.hypot(dx, dz);
  if (len > 0) {
    dx = (dx / len) * moveSpeed * dt;
    dz = (dz / len) * moveSpeed * dt;

    const nextX = camera.position.x + dx;
    const nextZ = camera.position.z + dz;

    if (!collides(nextX, camera.position.z)) camera.position.x = nextX;
    if (!collides(camera.position.x, nextZ)) camera.position.z = nextZ;
  }

  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
