<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会場レイアウト 3D — 会場20m × 15m ＋ 通路10m</title>
<style>
  :root{
    --ink:#0d1117; --panel:rgba(16,21,30,.88); --line:rgba(255,255,255,.14);
    --txt:#e6ecf5; --dim:#8d9ab0; --acc:#5fd4c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:var(--txt)}
  #cv{display:block;width:100%;height:100%}
  .ui{position:fixed;background:var(--panel);border:1px solid var(--line);
      border-radius:10px;backdrop-filter:blur(10px);font-size:12px}
  #side{top:12px;left:12px;width:216px;padding:12px 13px;max-height:calc(100vh - 24px);overflow:auto}
  #side h1{margin:0 0 2px;font-size:13px;letter-spacing:.04em}
  #side .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  .grp{margin:11px 0 0}
  .grp>.t{color:var(--acc);font-size:10px;letter-spacing:.12em;margin-bottom:6px}
  label.row{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;color:#cfd8e6}
  label.row:hover{color:#fff}
  input[type=checkbox]{accent-color:var(--acc);width:13px;height:13px;margin:0}
  .btns{display:flex;flex-wrap:wrap;gap:5px}
  button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#dbe3ef;
    border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;font-family:inherit}
  button:hover{background:rgba(95,212,196,.16);border-color:var(--acc)}
  button.on{background:var(--acc);color:#06231f;border-color:var(--acc);font-weight:700}
  #legend{right:12px;top:12px;padding:10px 12px;width:200px}
  #legend .t{color:var(--acc);font-size:10px;letter-spacing:.12em;margin-bottom:7px}
  #legend div.i{display:flex;gap:7px;align-items:center;padding:2px 0;color:#cfd8e6;font-size:11px}
  #legend i{width:11px;height:11px;border-radius:2px;flex:none}
  #help{left:12px;bottom:12px;padding:8px 11px;color:var(--dim);font-size:11px;line-height:1.7}
  #help b{color:#cfd8e6;font-weight:600}
  @media(max-width:760px){#legend{display:none}#side{width:174px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="side" class="ui">
  <h1>会場レイアウト 3D</h1>
  <div class="sub">会場15m＋裏通路5m＝20m ／ 奥行15m ／ 通路10m</div>

  <div class="grp"><div class="t">視点</div>
    <div class="btns">
      <button data-v="plan">真上（平面図）</button>
      <button data-v="top">俯瞰</button>
      <button data-v="ent">入口から</button>
      <button data-v="aud">観客席</button>
      <button data-v="stg">ステージ</button>
      <button data-v="ope">運営卓</button>
      <button id="walk">歩く</button>
    </div>
  </div>

  <div class="grp"><div class="t">撮影アングル</div>
    <div class="btns">
      <button data-v="cam1">① 入口側</button>
      <button data-v="cam2">② ステージ側</button>
      <button data-v="cam3">③ 運営卓側</button>
    </div>
    <div class="btns" style="margin-top:6px">
      <button id="shot">この画角をPNG保存</button>
    </div>
  </div>

  <div class="grp"><div class="t">表示切替</div>
    <label class="row"><input type="checkbox" data-g="stage" checked>ステージ・選手席・LED</label>
    <label class="row"><input type="checkbox" data-g="truss" checked>トラス</label>
    <label class="row"><input type="checkbox" data-g="mon" checked>柱モニター（通路側）</label>
    <label class="row"><input type="checkbox" data-g="banner" checked>トラスパネル ×3（観客後方）</label>
    <label class="row"><input type="checkbox" data-g="audience" checked>観客席（8席×3行）</label>
    <label class="row"><input type="checkbox" data-g="ope" checked>運営卓（3台・縦並び）</label>
    <label class="row"><input type="checkbox" data-g="booth" checked>企業ブース ×5</label>
    <label class="row"><input type="checkbox" data-g="cast" checked>実況・解説</label>
    <label class="row"><input type="checkbox" data-g="panel" checked>パネル（┓形2枚）・受付</label>
    <label class="row"><input type="checkbox" data-g="walls" checked>床・壁・通路</label>
    <label class="row"><input type="checkbox" data-g="labels" checked>ラベル</label>
    <label class="row"><input type="checkbox" data-g="grid" checked>1mグリッド</label>
  </div>
</div>

<div id="legend" class="ui">
  <div class="t">凡例</div>
  <div class="i"><i style="background:#3f6fd8"></i>ステージ 10×5m / H400</div>
  <div class="i"><i style="background:#6f8ad8"></i>選手席 ×2</div>
  <div class="i"><i style="background:#0f2a3a;border:1px solid #5fd4c4"></i>LED（H1.5〜5.5m）</div>
  <div class="i"><i style="background:#c9ccd4"></i>トラス H6m</div>
  <div class="i"><i style="background:#1b3d52"></i>柱モニター ×1（通路向き）</div>
  <div class="i"><i style="background:#e0a44c"></i>トラスパネル ×3（観客後方・入口向き）</div>
  <div class="i"><i style="background:#7f8ba0"></i>観客席 24席（8×3行）</div>
  <div class="i"><i style="background:#d9694f"></i>運営卓 ×3（縦並び）</div>
  <div class="i"><i style="background:#4fae86"></i>企業ブース ×5（幅1.2m）</div>
  <div class="i"><i style="background:#a86fd8"></i>実況・解説</div>
  <div class="i"><i style="background:#d8d2c4"></i>パネル ┓形 ×2</div>
  <div class="i"><i style="background:#2b3240"></i>裏通路（右5m・下2m）</div>
  <div class="i"><i style="background:#39424f"></i>通路 10m・受付</div>
</div>

<div id="help" class="ui">
  <b>左ドラッグ</b> 回転　<b>右ドラッグ</b> 平行移動　<b>ホイール</b> ズーム<br>
  歩くモード：<b>W A S D</b> 移動　<b>Shift</b> 走る　<b>マウス</b> 視線　<b>Esc</b> 解除
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   X … 0–10 通路 ／ 10–25 会場 ／ 25–30 右裏通路
   Z … 0–2 下裏通路 ／ 2–15 会場   （描画時 mz() で反転）
   ============================================================ */
const W=30, D=15, CW=10;
const HX0=10, HX1=25, HZ0=2, HZ1=15;
const ROOM_H=9;
const ENT={z0:3.0, z1:9.0};
const mz = z => D - z;

const C={
  base:0x161c25, hall:0x232b37, back:0x2b3240, corr:0x39424f,
  stage:0x3f6fd8, deskS:0x6f8ad8, led:0x0f2a3a,
  truss:0xc9ccd4, banner:0xe0a44c,
  seat:0x7f8ba0, ope:0xd9694f, booth:0x4fae86, cast:0xa86fd8,
  pane:0xd8d2c4, wood:0x8a6b4f, wall:0xffffff
};

const canvas=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1117);
scene.fog=new THREE.Fog(0x0d1117,55,140);
const camera=new THREE.PerspectiveCamera(50,1,0.1,600);

scene.add(new THREE.HemisphereLight(0xbcd2ff,0x171c24,0.78));
const sun=new THREE.DirectionalLight(0xffffff,0.85);
sun.position.set(18,32,12); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
const S=24;
sun.shadow.camera.left=-S; sun.shadow.camera.right=S;
sun.shadow.camera.top=S;   sun.shadow.camera.bottom=-S; sun.shadow.camera.far=110;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x88aaff,0.24); fill.position.set(-16,14,-10); scene.add(fill);

const root=new THREE.Group(); root.position.set(-W/2,0,-D/2); scene.add(root);
const G={};
['stage','truss','mon','banner','audience','ope','booth','cast','panel','walls','labels','grid']
  .forEach(k=>{G[k]=new THREE.Group(); root.add(G[k]);});

/* ---------- helpers ---------- */
const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
function box(g,w,h,d,cx,by,cz,c,o={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,o));
  m.position.set(cx,by+h/2,mz(cz));
  m.castShadow=!o.noShadow; m.receiveShadow=true; g.add(m); return m;
}
function slab(g,w,d,cx,cz,c,y=0.01){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat(c));
  m.rotation.x=-Math.PI/2; m.position.set(cx,y,mz(cz)); m.receiveShadow=true; g.add(m); return m;
}
function label(t,x,y,z,tone='#e6ecf5',k=1){
  const pad=22,fs=54,c=document.createElement('canvas'),m=c.getContext('2d');
  m.font=`600 ${fs}px "Hiragino Sans","Noto Sans JP",sans-serif`;
  c.width=Math.ceil(m.measureText(t).width)+pad*2; c.height=fs+pad;
  const g2=c.getContext('2d');
  g2.font=`600 ${fs}px "Hiragino Sans","Noto Sans JP",sans-serif`;
  g2.fillStyle='rgba(10,14,20,.84)'; g2.fillRect(0,0,c.width,c.height);
  g2.strokeStyle='rgba(255,255,255,.18)'; g2.lineWidth=3; g2.strokeRect(1.5,1.5,c.width-3,c.height-3);
  g2.fillStyle=tone; g2.textBaseline='middle'; g2.fillText(t,pad,c.height/2+2);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  const u=0.0072*k; s.scale.set(c.width*u,c.height*u,1); s.position.set(x,y,mz(z));
  G.labels.add(s); return s;
}
function table(g,w,d,cx,cz,c,h=0.72,base=0){
  box(g,w,0.05,d,cx,base+h,cz,c);
  box(g,0.06,h,d*0.9,cx-w/2+0.06,base,cz,c);
  box(g,0.06,h,d*0.9,cx+w/2-0.06,base,cz,c);
}
function chair(g,cx,cz,dir,c=C.seat,base=0){
  const s=0.44,t=0.07,o=s/2;
  box(g,s,0.42,s,cx,base,cz,c);
  if(dir==='+Z') box(g,s,0.46,t,cx,base+0.42,cz-o,c);
  if(dir==='-Z') box(g,s,0.46,t,cx,base+0.42,cz+o,c);
  if(dir==='+X') box(g,t,0.46,s,cx-o,base+0.42,cz,c);
  if(dir==='-X') box(g,t,0.46,s,cx+o,base+0.42,cz,c);
}
function monitor(g,cx,cz,dir,y){
  const c=0x11161f;
  if(dir==='+Z'||dir==='-Z') box(g,0.5,0.32,0.04,cx,y+0.06,cz,c);
  else                       box(g,0.04,0.32,0.5,cx,y+0.06,cz,c);
  box(g,0.16,0.06,0.16,cx,y,cz,0x2a3240);
}

/* ============================================================
   1. 床・通路・壁
   ============================================================ */
slab(G.walls,W,D,W/2,D/2,C.base,0.0);
slab(G.walls,HX1-HX0,HZ1-HZ0,(HX0+HX1)/2,(HZ0+HZ1)/2,C.hall,0.012);
slab(G.walls,CW,D,CW/2,D/2,C.corr,0.008);
slab(G.walls,W-HX1,D,HX1+(W-HX1)/2,D/2,C.back,0.008);
slab(G.walls,HX1-HX0,HZ0,(HX0+HX1)/2,HZ0/2,C.back,0.008);

const wo={transparent:true,opacity:0.10,noShadow:true,side:THREE.DoubleSide};
box(G.walls,W,4,0.12,W/2,0,0,C.wall,wo);
box(G.walls,W,4,0.12,W/2,0,D,C.wall,wo);
box(G.walls,0.12,4,D,0,0,D/2,C.wall,wo);
box(G.walls,0.12,4,D,W,0,D/2,C.wall,wo);

const po={transparent:true,opacity:0.17,noShadow:true};
box(G.walls,0.12,3.2,ENT.z0-HZ0,HX0,0,(HZ0+ENT.z0)/2,C.wall,po);
box(G.walls,0.12,3.2,HZ1-ENT.z1,HX0,0,(ENT.z1+HZ1)/2,C.wall,po);
box(G.walls,0.12,3.2,HZ1-HZ0,HX1,0,(HZ0+HZ1)/2,C.wall,po);
box(G.walls,HX1-HX0,3.2,0.12,(HX0+HX1)/2,0,HZ0,C.wall,po);

const eg=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W,ROOM_H,D)),
  new THREE.LineBasicMaterial({color:0x3a4658}));
eg.position.set(W/2,ROOM_H/2,D/2); G.walls.add(eg);

const grid=new THREE.GridHelper(Math.max(W,D),Math.max(W,D),0x3d4a5c,0x28313f);
grid.position.set(W/2,0.02,D/2); G.grid.add(grid);

/* ============================================================
   2. ステージ 10m × 5m / H400
   ============================================================ */
const ST={x0:20.0,x1:25.0,z0:4.2,z1:14.2,h:0.4};
box(G.stage,ST.x1-ST.x0,ST.h,ST.z1-ST.z0,(ST.x0+ST.x1)/2,0,(ST.z0+ST.z1)/2,C.stage);
box(G.stage,0.07,ST.h,ST.z1-ST.z0,ST.x0+0.035,0,(ST.z0+ST.z1)/2,0x2a4ea0);

[6.6,11.8].forEach(cz=>{
  table(G.stage,1.2,3.0,21.3,cz,C.deskS,0.72,ST.h);
  [-1.0,0,1.0].forEach(o=>{
    monitor(G.stage,21.05,cz+o,'-X',ST.h+0.77);
    chair(G.stage,21.95,cz+o,'-X',0x4e5f86,ST.h);
  });
});

const LED={x:24.75,w:6.0,h:4.0,base:1.5,cz:(ST.z0+ST.z1)/2};
box(G.stage,0.28,LED.h,LED.w,LED.x,LED.base,LED.cz,0x11161f);
box(G.stage,0.06,LED.h-0.24,LED.w-0.24,LED.x-0.16,LED.base+0.12,LED.cz,C.led,{emissive:0x14455f});
[LED.cz-LED.w/2+0.5,LED.cz+LED.w/2-0.5].forEach(z=>
  box(G.stage,0.35,LED.base-ST.h,0.35,LED.x,ST.h,z,0x30384a));

/* ============================================================
   3. トラス（会場全体 H6m）※入場開口の柱は撤去
   ============================================================ */
const TR={h:6.0,t:0.30,x0:HX0+0.35,x1:HX1-0.35,zs:[HZ0+0.9,(HZ0+HZ1)/2,HZ1-0.9]};
const LEDZ={z0:(HZ0+HZ1)/2-3.0, z1:(HZ0+HZ1)/2+3.0};   // LEDの掛かる範囲
const MONZ=[];                                          // モニターを付ける柱のZ
TR.zs.forEach(z=>{
  // 左側：入場開口の中だけ柱を立てない（企業ブース・受付側の柱は残す）
  if(!(z>ENT.z0 && z<ENT.z1)){
    box(G.truss,TR.t,TR.h,TR.t,TR.x0,0,z,C.truss);
    MONZ.push(z);
  }
  // 右側：LEDに掛かる柱は撤去
  if(!(z>LEDZ.z0 && z<LEDZ.z1)) box(G.truss,TR.t,TR.h,TR.t,TR.x1,0,z,C.truss);
  box(G.truss,TR.x1-TR.x0,TR.t,TR.t,(TR.x0+TR.x1)/2,TR.h-TR.t,z,C.truss);
});

// 通路側トラス柱のモニター ×1（入口寄りの柱／通路=-X 側を向く・下端2.2m）
[MONZ[0]].forEach(z=>{
  box(G.mon,0.15,0.10,0.30,TR.x0-0.225,2.62,z,C.truss);                       // 取付ブラケット
  box(G.mon,0.10,0.80,1.36,TR.x0-0.35,2.20,z,0x11161f);                       // 筐体
  box(G.mon,0.04,0.70,1.26,TR.x0-0.42,2.25,z,0x1b3d52,{emissive:0x11455e});   // 画面
});
for(let x of [TR.x0,TR.x1])
  box(G.truss,TR.t,TR.t,TR.zs[2]-TR.zs[0],x,TR.h-TR.t,(TR.zs[0]+TR.zs[2])/2,C.truss);

// 通路側の柱にモニター（通路＝-X 側を向く）
TR.zs.forEach(z=>{
  if(z>ENT.z0 && z<ENT.z1) return;              // 柱が無い位置には付けない
  box(G.truss,0.22,0.10,0.10,TR.x0-0.10,2.55,z,C.truss);                     // 取付アーム
  box(G.truss,0.10,0.80,1.42,TR.x0-0.22,2.20,z,0x11161f);                    // 筐体
  box(G.truss,0.04,0.68,1.30,TR.x0-0.28,2.26,z,0x16303f,{emissive:0x0d3346});// 画面
});

/* ============================================================
   4. トラスパネル ×3（観客席の後方／入口=-X 側を向く）
   ============================================================ */
const BN={x:14.20, top:6.0, h:2.2, w:2.8, zs:[5.6,9.2,12.8]};
box(G.banner,TR.t,TR.t,TR.zs[2]-TR.zs[0],BN.x,BN.top-TR.t,(TR.zs[0]+TR.zs[2])/2,C.truss);
BN.zs.forEach(z=>{
  box(G.banner,0.12,BN.h,BN.w,BN.x,BN.top-TR.t-BN.h,z,C.banner);
  box(G.banner,0.18,0.10,BN.w+0.16,BN.x,BN.top-TR.t-0.10,z,C.truss);
});

/* ============================================================
   5. 観客席 24席（8席 × 3行 / ステージまで約3m）
   ============================================================ */
for(let r=0;r<3;r++)
  for(let c=0;c<8;c++)
    chair(G.audience, 16.78 - r*0.92, 5.40 + c*0.62, '+X');

/* ============================================================
   6. 運営卓（長机3台・縦並び）
   ============================================================ */
[14.10,12.55,11.00].forEach(cz=>{
  table(G.ope,1.8,0.70,18.30,cz,C.ope);
  [-0.6,0,0.6].forEach(o=>{
    monitor(G.ope,18.30+o,cz+0.12,'-Z',0.77);
    chair(G.ope,18.30+o,cz+0.65,'-Z',0x5d6579);
  });
});

/* ============================================================
   7. 企業ブース ×5（会場 左下・小さめ／パネルは会場側を向く）
   ============================================================ */
[11.0,12.4,13.8,15.2,16.6].forEach(cx=>{
  box(G.booth,1.20,2.10,0.09,cx,0,2.50,C.pane);
  box(G.booth,1.20,0.06,0.32,cx,0,2.66,0x3a4252);
  table(G.booth,1.10,0.50,cx,3.05,C.booth);
  chair(G.booth,cx,2.78,'+Z',0x46596b);
});

/* ============================================================
   8. 実況・解説（企業ブースの右／観客側=+Z 向き）
   ============================================================ */
const CB={cx:18.30,cz:3.90,w:2.6,d:1.7,h:0.6};
box(G.cast,CB.w,CB.h,CB.d,CB.cx,0,CB.cz,C.cast);
table(G.cast,2.2,0.6,CB.cx,CB.cz+0.4,0x6a4a94,0.72,CB.h);
[-0.55,0.55].forEach(o=>{
  chair(G.cast,CB.cx+o,CB.cz-0.2,'+Z',0x5a4a72,CB.h);
  monitor(G.cast,CB.cx+o,CB.cz+0.55,'+Z',CB.h+0.77);
});

/* ============================================================
   9. パネル ┓形 ×2（会場 左上）＋ 受付
   ============================================================ */
const PN={h:2.0,t:0.10};
// 横板（┓の上辺）
box(G.panel,5.00,PN.h,PN.t,13.40,0,14.60,C.pane);
box(G.panel,5.00,0.06,0.36,13.40,0,14.44,0x3a4252);
// 縦板（┓の縦棒）
box(G.panel,PN.t,PN.h,3.50,15.85,0,12.85,C.pane);
box(G.panel,0.36,0.06,3.50,15.69,0,12.85,0x3a4252);

table(G.panel,0.6,2.4,8.90,2.9,C.wood);                 // 受付
[-0.8,0,0.8].forEach(o=> chair(G.panel,8.40,2.9+o,'-X',0x5d6579));
slab(G.panel,CW-1.0,ENT.z1-ENT.z0+1.0,CW/2-0.4,(ENT.z0+ENT.z1)/2,0x44586a,0.03);

/* ============================================================
   10. ラベル
   ============================================================ */
label('ステージ 10×5m / H400',22.5,3.1,9.2,'#9dc0ff');

label('観客 8席×3行',15.9,2.1,7.6,'#cfd8e6',1.1);

/* ============================================================
   カメラ
   ============================================================ */
const wx = x => x - W/2, wz = z => mz(z) - D/2;

const target=new THREE.Vector3(0,1.6,0);
let sphr={r:40,th:-0.95,ph:0.92}, walk=false;
const pos=new THREE.Vector3(wx(6.0),1.6,wz(6.0));
let yaw=-Math.PI/2, pitch=-0.03; const keys={};

function applyOrbit(){
  camera.position.set(
    target.x+sphr.r*Math.sin(sphr.ph)*Math.sin(sphr.th),
    target.y+sphr.r*Math.cos(sphr.ph),
    target.z+sphr.r*Math.sin(sphr.ph)*Math.cos(sphr.th));
  camera.lookAt(target);
}
let drag=null,px=0,py=0;
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{
  if(walk)return;
  drag=(e.button===2||e.shiftKey)?'pan':'rot';
  px=e.clientX; py=e.clientY; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointermove',e=>{
  if(walk){
    if(document.pointerLockElement===canvas){
      yaw-=e.movementX*0.0022;
      pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*0.0022));
    } return;
  }
  if(!drag)return;
  const dx=e.clientX-px,dy=e.clientY-py; px=e.clientX; py=e.clientY;
  if(drag==='rot'){
    sphr.th-=dx*0.006;
    sphr.ph=Math.max(0.02,Math.min(1.52,sphr.ph-dy*0.006));
  }else{
    const k=sphr.r*0.0016;
    const r=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
    const u=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
    target.addScaledVector(r,-dx*k).addScaledVector(u,dy*k);
  }
  applyOrbit();
});
canvas.addEventListener('wheel',e=>{
  if(walk)return; e.preventDefault();
  sphr.r=Math.max(4,Math.min(130,sphr.r*(1+Math.sign(e.deltaY)*0.1)));
  applyOrbit();
},{passive:false});

addEventListener('keydown',e=>keys[e.code]=true);
addEventListener('keyup',e=>keys[e.code]=false);

const walkBtn=document.getElementById('walk');
walkBtn.onclick=()=>{
  walk=!walk; walkBtn.classList.toggle('on',walk);
  if(walk) canvas.requestPointerLock(); else {document.exitPointerLock(); applyOrbit();}
};
document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement!==canvas&&walk){
    walk=false; walkBtn.classList.remove('on'); applyOrbit();
  }
});

const ISO=0.9553;                       // 等角投影と同じ仰角(35.26°)
const VIEWS={
  plan:{r:34,th:0.0,  ph:0.03, t:[0,0,0]},
  top :{r:42,th:-0.95,ph:0.68, t:[0,0,0]},
  ent :{r:13,th:-1.48,ph:1.30, t:[wx(12.0),1.5,wz(6.0)]},
  aud :{r:11,th:-1.32,ph:1.26, t:[wx(18.5),1.4,wz(9.0)]},
  stg :{r:16,th:1.40, ph:1.20, t:[wx(22.0),2.0,wz(9.2)]},
  ope :{r:10,th:-0.10,ph:1.20, t:[wx(18.3),1.6,wz(12.6)]},
  // ---- 撮影アングル（アイソメ図 VIEW1〜3 と同じ向き）----
  cam1:{r:41,th:-Math.PI/4,   ph:ISO, t:[0,2.0,0]},   // 入口・企業ブース側
  cam2:{r:41,th: Math.PI/4,   ph:ISO, t:[0,2.0,0]},   // ステージ・実況側
  cam3:{r:41,th:-Math.PI*3/4, ph:ISO, t:[0,2.0,0]}    // 運営卓・パネル側
};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
  if(walk){walk=false; walkBtn.classList.remove('on'); document.exitPointerLock();}
  const v=VIEWS[b.dataset.v];
  sphr={r:v.r,th:v.th,ph:v.ph}; target.set(v.t[0],v.t[1],v.t[2]); applyOrbit();
});
document.querySelectorAll('[data-g]').forEach(cb=>
  cb.onchange=()=>G[cb.dataset.g].visible=cb.checked);

// 現在の画角をPNGとして保存
document.getElementById('shot').onclick=()=>{
  renderer.render(scene,camera);
  const a=document.createElement('a');
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  a.download=`会場レイアウト_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
  a.href=canvas.toDataURL('image/png');
  a.click();
};

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize(); applyOrbit();

let last=performance.now();
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(walk){
    const s=(keys.ShiftLeft?6:3)*dt;
    const fw=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
    const rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    if(keys.KeyW)pos.addScaledVector(fw,s);
    if(keys.KeyS)pos.addScaledVector(fw,-s);
    if(keys.KeyD)pos.addScaledVector(rt,s);
    if(keys.KeyA)pos.addScaledVector(rt,-s);
    pos.x=Math.max(-W/2+0.4,Math.min(W/2-0.4,pos.x));
    pos.z=Math.max(-D/2+0.4,Math.min(D/2-0.4,pos.z));
    pos.y=1.6; camera.position.copy(pos);
    camera.lookAt(pos.x-Math.sin(yaw),pos.y+Math.tan(pitch),pos.z-Math.cos(yaw));
  }
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
